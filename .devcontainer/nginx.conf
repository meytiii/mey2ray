# ==============================================================================
# Mey2Ray Nginx Reverse Proxy Configuration
# Handles HTTP dashboard, /sub subscription, and VLESS WebSocket proxying
# ==============================================================================
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Map WebSocket upgrade headers
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 443 default_server;
        listen [::]:443 default_server;
        server_name _;

        root /var/www/dashboard;
        index index.html;

        # Local healthcheck endpoint
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # Base64 VLESS subscription endpoint
        location = /sub {
            default_type "text/plain; charset=utf-8";
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Profile-Title "Mey2Ray" always;
            add_header Profile-Update-Interval "24" always;
            add_header Subscription-Userinfo "upload=0; download=0; total=1073741824000; expire=0" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            alias /var/www/sub/index.txt;
        }

        # Dynamic dashboard data JSON
        location = /data.json {
            default_type "application/json; charset=utf-8";
            add_header Content-Type "application/json; charset=utf-8" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            alias /var/www/dashboard/data.json;
        }

        # Root route: WebSocket requests are rewritten to internal Xray proxy;
        # normal HTTP GET requests serve the static dashboard.
        location / {
            if ($http_upgrade ~* "websocket") {
                rewrite ^(.*)$ /__ws_proxy__$1 last;
            }
            try_files $uri $uri/ /index.html;
        }

        # Internal proxy to local Xray instance (127.0.0.1:8443)
        location /__ws_proxy__/ {
            internal;
            rewrite ^/__ws_proxy__(.*)$ $1 break;

            proxy_pass http://127.0.0.1:8443;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Extended timeouts for persistent WebSocket proxying
            proxy_connect_timeout 60s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }
    }
}
